name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilar CSS (Tailwind)
        run: npx --yes tailwindcss@3.4.19 -c tailwind.config.js -i assets/src/app.css -o assets/app.css --minify

      - name: Deploy por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.estudiocero.com.gt
          username: deploy@farmacia.nuevaexpress.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            assets/src/**
            tailwind.config.js
            package.json
            package-lock.json
            README.md
            config/config.local.php
