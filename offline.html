<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>Sin conexión · FarmaPro</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="min-h-screen bg-slate-50 grid place-items-center p-6 font-sans antialiased">
  <div class="card max-w-sm w-full p-8 text-center">
    <img src="assets/icons/icon-192.png" alt="" class="w-16 h-16 mx-auto rounded-2xl mb-5">
    <h1 class="text-xl font-extrabold text-slate-900">Sin conexión a internet</h1>
    <p class="text-sm text-slate-500 mt-2">Revisa tu conexión. Las ventas y el inventario necesitan internet para mantenerse sincronizados.</p>
    <button onclick="location.reload()" class="btn-primary w-full mt-6">Reintentar</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
